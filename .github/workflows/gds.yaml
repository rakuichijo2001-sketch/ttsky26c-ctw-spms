name: gds

on:
  push:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: ctw-spms-gds
  cancel-in-progress: true

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel obsolete GDS runs
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'gds.yaml',
              status: 'in_progress',
              per_page: 100,
            });

            for (const run of data.workflow_runs) {
              if (run.id !== context.runId) {
                core.info(`Cancelling obsolete GDS run ${run.id} (${run.head_sha})`);
                await github.rest.actions.cancelWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
              }
            }

      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26c
        with:
          pdk: sky130A

      - name: Enforce CTW-SPMS signoff policy
        run: python3 scripts/check_signoff.py runs/wokwi

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26c

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26c
